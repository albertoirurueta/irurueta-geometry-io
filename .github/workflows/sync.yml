name: Sync

# After a release is published from master, open a pull request that merges it back into
# develop and bumps the development snapshot version, so develop never has to wait for a
# manual sync branch.
on:
  release:
    types: [released]
  # Manual re-run for a release whose sync was missed, e.g. `gh workflow run sync.yml -f tag=1.7.1`.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync back into develop (X.Y.Z)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open sync PR from the released branch into develop
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.target_commitish == 'master'
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute versions and branch names
        id: versions
        run: |
          set -euo pipefail
          RELEASE_VERSION="${{ github.event.release.tag_name || inputs.tag }}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
          if [ -z "${MAJOR:-}" ] || [ -z "${MINOR:-}" ] || [ -z "${PATCH:-}" ]; then
            echo "::error::Release tag '$RELEASE_VERSION' is not in X.Y.Z form; cannot compute the next snapshot."
            exit 1
          fi

          NEXT_MINOR=$((MINOR + 1))
          NEXT_SNAPSHOT="${MAJOR}.${NEXT_MINOR}.0-SNAPSHOT"
          # Keyed on the release itself, not the next snapshot: a patch release (e.g. 1.7.1)
          # computes the same next snapshot as the minor release before it (1.7.0 -> 1.8.0), so a
          # snapshot-named branch left over from that earlier sync would wrongly skip this one.
          SYNC_BRANCH="sync_${RELEASE_VERSION}"

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_snapshot=$NEXT_SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Skip if this release was already synced
        id: guard
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${{ steps.versions.outputs.sync_branch }}" >/dev/null 2>&1; then
            echo "::notice::${{ steps.versions.outputs.sync_branch }} already exists on origin; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.guard.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create sync branch from develop
        if: steps.guard.outputs.exists == 'false'
        run: |
          git fetch origin develop master
          git checkout -b "${{ steps.versions.outputs.sync_branch }}" "origin/develop"

      - name: Read develop's current version
        id: develop
        if: steps.guard.outputs.exists == 'false'
        run: |
          echo "version=$(python3 -c 'import sys; sys.path.insert(0, ".github/scripts"); import sync_versions as s; print(s.read_project_version())')" >> "$GITHUB_OUTPUT"

      - name: Merge the released branch into the sync branch
        if: steps.guard.outputs.exists == 'false'
        run: |
          git merge --no-ff --no-edit \
            -m "Merge master (${{ steps.versions.outputs.release_version }}) into develop" \
            "origin/master"

      - name: Set up Python
        if: steps.guard.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bump the development snapshot version
        id: bump
        if: steps.guard.outputs.exists == 'false'
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          NEXT_SNAPSHOT: ${{ steps.versions.outputs.next_snapshot }}
          DEVELOP_VERSION: ${{ steps.develop.outputs.version }}
        run: python3 .github/scripts/sync_versions.py

      - name: Commit the version bump
        if: steps.guard.outputs.exists == 'false'
        run: |
          git add pom.xml README.md docs/antora.yml docs/modules/ROOT/pages
          git diff --cached --quiet || git commit -m "Sync ${{ steps.bump.outputs.next_snapshot }}"

      - name: Push sync branch
        if: steps.guard.outputs.exists == 'false'
        run: git push origin "${{ steps.versions.outputs.sync_branch }}"

      - name: Ensure the sync label exists
        if: steps.guard.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create sync --description "Sync pull request from a release branch back into develop" --color 0e8a16 \
            || gh label list --search sync >/dev/null

      - name: Open pull request into develop
        if: steps.guard.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head "${{ steps.versions.outputs.sync_branch }}" \
            --title "Sync ${{ steps.bump.outputs.next_snapshot }}" \
            --body "Merges \`master\` back into \`develop\` after releasing \`${{ steps.versions.outputs.release_version }}\`, and bumps the development snapshot version to \`${{ steps.bump.outputs.next_snapshot }}\` in \`pom.xml\`, \`README.md\`, and the Antora docs." \
            --label sync
